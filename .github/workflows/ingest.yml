# Index workrr certificates and findings. Anyone can submit (an issue from the "Submit a
# certificate" form, a maintainer's workflow_dispatch, or the scheduled discover
# workflow, which calls this one) and nobody needs write
# access: a submission is only a pointer (repo + digest). The ledger fetches the
# bundle from GitHub's public attestation store and verifies it independently
# (scripts/ingest.sh) before committing. The certifier holds no ledger credential.
#
# Jobs are split by privilege: `verify` handles untrusted input and fetches the
# untrusted source repo with a read-only token; only `commit` can write, and it
# only copies files that `verify` produced under certificates/sha256/.
name: ingest

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      repository:
        description: GitHub repo that ran the certifier (owner/repo)
        required: true
      digest:
        description: Artifact digest (sha256:<hex>)
        required: true
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
      digest:
        type: string
        required: false
      # Or a batch from discover: JSON [{repository, digest}, ...]. One build, one
      # verify loop and one signed commit for the whole batch.
      pairs:
        type: string
        required: false
      batch:
        description: Unique name for this batch's artifact
        type: string
        required: false

permissions: {}

env:
  # workrr-trust/certify v0.1.5 (verify-finding; scan.yml observer at v0.1.4 and v0.1.5)
  CERTIFY_SHA: 5fb6a6635f5cee1f8fe51cfa27fa997298d2faf3

jobs:
  verify:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'certificate')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      count: ${{ steps.ingest.outputs.count }}
      repository: ${{ steps.input.outputs.repository }}
      digest: ${{ steps.input.outputs.digest }}
      artifact: ${{ steps.input.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: workrr-trust/certify
          ref: ${{ env.CERTIFY_SHA }}
          path: .certify
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/ckpt/go.mod
          cache-dependency-path: |
            .certify/go/go.sum
            tools/ckpt/go.sum
      - name: Build workrr and ckpt
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd .certify/go && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/bin/workrr" ./cmd/workrr)
          (cd tools/ckpt && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/bin/ckpt" .)
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Read submission
        id: input
        env:
          EVENT: ${{ github.event_name }}
          IN_REPO: ${{ inputs.repository }}
          IN_DIGEST: ${{ inputs.digest }}
          IN_PAIRS: ${{ inputs.pairs }}
          IN_BATCH: ${{ inputs.batch }}
        run: |
          if [ -n "$IN_PAIRS" ]; then
            # Validated again in ingest.sh; only safe values reach it.
            jq -r '.[] | [.repository, .digest] | @tsv' <<<"$IN_PAIRS" |
              awk -F'\t' '$1 ~ /^[A-Za-z0-9][A-Za-z0-9-]{0,38}\/[A-Za-z0-9._-]{1,100}$/ && $2 ~ /^(sha256:)?[0-9a-f]{64}$/' >"$RUNNER_TEMP/pairs.tsv"
            echo "repository=batch" >>"$GITHUB_OUTPUT"
            echo "digest=$(wc -l <"$RUNNER_TEMP/pairs.tsv" | tr -d ' ') digests" >>"$GITHUB_OUTPUT"
            [[ $IN_BATCH =~ ^[A-Za-z0-9_-]{1,80}$ ]] || IN_BATCH=batch
            echo "artifact=ingest-$IN_BATCH" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = issues ]; then
            # Issue-form body: "### Repository\n\n<value>\n\n### Artifact digest\n\n<value>"
            field() { jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" | tr -d '\r' |
              awk -v h="### $1" '$0 == h { getline; getline; print; exit }' | tr -d '[:space:]`'; }
            IN_REPO=$(field Repository)
            IN_DIGEST=$(field "Artifact digest")
          fi
          IN_REPO=${IN_REPO#https://github.com/}
          # Validated again in ingest.sh; only safe values leave this step.
          [[ $IN_REPO =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$ ]] || IN_REPO=invalid
          [[ $IN_DIGEST =~ ^(sha256:)?[0-9a-f]{64}$ ]] || IN_DIGEST=invalid
          echo "repository=$IN_REPO" >>"$GITHUB_OUTPUT"
          echo "digest=sha256:${IN_DIGEST#sha256:}" >>"$GITHUB_OUTPUT"
          printf '%s\t%s\n' "$IN_REPO" "sha256:${IN_DIGEST#sha256:}" >"$RUNNER_TEMP/pairs.tsv"
          # Unique per submission: discover runs several ingests in one workflow run.
          echo "artifact=ingest-${IN_REPO//\//_}-${IN_DIGEST: -16}" >>"$GITHUB_OUTPUT"
      - name: Verify
        id: ingest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          : >"$out/summary.md"
          : >"$out/index.jsonl"
          count=0 n=0 failed=0
          while IFS=$'\t' read -r repo digest; do
            n=$((n + 1))
            one="$RUNNER_TEMP/one-$n"
            bash scripts/ingest.sh "$repo" "$digest" "$one" || failed=$((failed + 1))
            count=$((count + $(cat "$one/count" 2>/dev/null || echo 0)))
            { echo "#### $repo $digest"; cat "$one/summary.md"; } >>"$out/summary.md"
            if [ -f "$one/index.jsonl" ]; then cat "$one/index.jsonl" >>"$out/index.jsonl"; fi
            for d in certificates findings; do
              if [ -d "$one/$d" ]; then mkdir -p "$out/$d" && cp -R "$one/$d/." "$out/$d/"; fi
            done
          done <"$RUNNER_TEMP/pairs.tsv"
          echo "$count" >"$out/count"
          echo "count=$count" >>"$GITHUB_OUTPUT"
          cat "$out/summary.md" >>"$GITHUB_STEP_SUMMARY"
          # A single submission must verify. A batch fails only if every pair did;
          # individual failures are listed in the summary.
          [ "$failed" -eq 0 ] || { [ "$n" -gt 1 ] && [ "$failed" -lt "$n" ]; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ steps.input.outputs.artifact || 'ingest' }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 7

  commit:
    needs: verify
    if: needs.verify.outputs.count != '' && needs.verify.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The branch tip, not the event's commit: a run queued behind another
      # ledger writer would otherwise start from a tree that is already behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact || 'ingest' }}
          path: ${{ runner.temp }}/out
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ needs.verify.outputs.repository }}
          DIGEST: ${{ needs.verify.outputs.digest }}
          ARTIFACT: ${{ needs.verify.outputs.artifact }}
        run: |
          cd "$RUNNER_TEMP/out"
          mapfile -t files < <(find certificates findings -type f 2>/dev/null | sort)
          cd "$GITHUB_WORKSPACE"
          for f in "${files[@]}"; do
            [[ $f =~ ^(certificates|findings)/sha256/[0-9a-f]{64}/[0-9]{1,20}\.sigstore\.json$ ]] || { echo "unexpected path $f"; exit 1; }
            [ ! -e "$f" ] || { echo "already indexed: $f"; continue; }
            mkdir -p "$(dirname "$f")"
            cp "$RUNNER_TEMP/out/$f" "$f"
            new+=("$f")
          done
          [ ${#new[@]} -gt 0 ] || { echo "Nothing new."; exit 0; }
          # The index lines for exactly the files committed here, as one immutable file
          # (the site reads these instead of every bundle).
          idx="index/$(date -u +%Y/%m/%d)/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${ARTIFACT//[^A-Za-z0-9_-]/_}.jsonl"
          mkdir -p "$(dirname "$idx")"
          printf '%s\n' "${new[@]}" | jq -R . | jq -s . >"$RUNNER_TEMP/new.json"
          jq -c --slurpfile keep "$RUNNER_TEMP/new.json" 'select(.file as $f | $keep[0] | index($f))' \
            "$RUNNER_TEMP/out/index.jsonl" >"$idx"
          [ -s "$idx" ] && new+=("$idx")
          headline="certificate: $REPO $DIGEST"
          [ "$REPO" != batch ] || headline="ingest: $(( ${#new[@]} - 1 )) record(s) from $DIGEST"
          COMMIT_BODY="$(head -c 60000 "$RUNNER_TEMP/out/summary.md")" \
            bash scripts/commit.sh "$headline" "${new[@]}"

  report:
    needs: [verify, commit]
    if: always() && github.event_name == 'issues' && needs.verify.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: ${{ needs.verify.outputs.artifact || 'ingest' }}
          path: ${{ runner.temp }}/out
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          VERIFY: ${{ needs.verify.result }}
          COMMIT: ${{ needs.commit.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary=$(cat "$RUNNER_TEMP/out/summary.md" 2>/dev/null || echo "- ✗ verification did not produce a summary")
          if [ "$VERIFY" = success ] && [ "$COMMIT" != failure ]; then
            verdict="Verified. Indexed certificates are listed below; nothing new is committed for certificates already in the ledger."
            reason=completed
          else
            verdict="Not indexed. Check the repository and digest (it is the \`subject-digest\` the certifier printed) and resubmit."
            reason="not planned"
          fi
          printf '%s\n\n%s\n\n[Run log](%s)\n' "$verdict" "$summary" "$RUN_URL" | gh issue comment "$ISSUE" --body-file -
          gh issue close "$ISSUE" --reason "$reason"
