# Add submitted skills (skills.workrr.ai "Add a skill") as scan targets.
#
# A submission is only a pointer: a public GitHub repo and a path in it. Nothing is
# copied. This workflow checks each one against GitHub (the repo is public, the path
# exists on its default branch), then appends it to scan-targets.txt, so
# workrr-trust/certify's watcher gives it a public scan, and the repo to sources.txt,
# so certificates its maintainer signs are discovered too. One signed commit per run.
#
# Dispatched by the workrr-ledger-clock Worker with up to 50 submissions. Results
# (added / already listed / rejected, with a reason) go to the `add-targets` artifact,
# which the clock reads back to show each submitter where their skill stands.
name: add-targets

on:
  workflow_dispatch:
    inputs:
      targets:
        description: JSON [{submission, repository, path}, ...] (at most 50)
        required: true

permissions: {}

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      added: ${{ steps.check.outputs.added }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check each submission against GitHub
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          : >"$out/results.jsonl"; : >"$out/new-targets.txt"; : >"$out/new-sources.txt"
          jq -e 'type == "array" and length <= 50' <<<"$TARGETS" >/dev/null || { echo "::error::targets must be a JSON array of at most 50"; exit 1; }
          # Existing lines, lowercased, so a case variant isn't added twice.
          sed -e 's/#.*//' scan-targets.txt | awk 'NF == 2 {print tolower($1) " " $2}' >"$RUNNER_TEMP/listed.txt"
          sed -e 's/#.*//' -e 's/[[:space:]]//g' sources.txt | awk 'NF {print tolower($0)}' >"$RUNNER_TEMP/sources.txt"
          result() { jq -nc --arg s "$1" --arg r "$2" --arg p "$3" --arg st "$4" --arg why "$5" \
            '{submission: $s, repository: $r, path: $p, status: $st, reason: $why}' >>"$out/results.jsonl"; }
          while IFS= read -r t; do
            sub=$(jq -r '.submission // "" | tostring | .[0:64]' <<<"$t")
            repo=$(jq -r '.repository // "" | tostring' <<<"$t")
            path=$(jq -r '.path // "." | tostring' <<<"$t")
            [[ $repo =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$ ]] || { result "$sub" "$repo" "$path" rejected "not an owner/repo name"; continue; }
            path=${path#./}; path=${path%/}; [ -n "$path" ] || path=.
            if [ "$path" != . ] && { [[ ! $path =~ ^[A-Za-z0-9._@+/-]{1,255}$ ]] || [[ $path == /* ]] || [[ /$path/ == */../* ]]; }; then
              result "$sub" "$repo" "$path" rejected "not a path inside the repository"; continue
            fi
            if ! meta=$(gh api "repos/$repo" 2>/dev/null); then result "$sub" "$repo" "$path" rejected "no public GitHub repository by that name"; continue; fi
            [ "$(jq -r .private <<<"$meta")" = false ] || { result "$sub" "$repo" "$path" rejected "the repository is not public"; continue; }
            repo=$(jq -r .full_name <<<"$meta"); branch=$(jq -r .default_branch <<<"$meta")
            if [ "$path" != . ] && ! gh api "repos/$repo/contents/$path?ref=$branch" --silent 2>/dev/null; then
              result "$sub" "$repo" "$path" rejected "no such path on the default branch ($branch)"; continue
            fi
            key="$(tr '[:upper:]' '[:lower:]' <<<"$repo") $path"
            if grep -qxF "$key" "$RUNNER_TEMP/listed.txt"; then result "$sub" "$repo" "$path" exists ""; continue; fi
            echo "$key" >>"$RUNNER_TEMP/listed.txt"
            echo "$repo $path" >>"$out/new-targets.txt"
            if ! grep -qxF "$(tr '[:upper:]' '[:lower:]' <<<"$repo")" "$RUNNER_TEMP/sources.txt"; then
              tr '[:upper:]' '[:lower:]' <<<"$repo" >>"$RUNNER_TEMP/sources.txt"
              echo "$repo" >>"$out/new-sources.txt"
            fi
            result "$sub" "$repo" "$path" added ""
          done < <(jq -c '.[]' <<<"$TARGETS")
          cat "$out/results.jsonl"
          echo "added=$(wc -l <"$out/new-targets.txt" | tr -d ' ')" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: add-targets
          path: ${{ runner.temp }}/out
          retention-days: 14

  commit:
    needs: check
    if: needs.check.outputs.added != '' && needs.check.outputs.added != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: add-targets
          path: ${{ runner.temp }}/out
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-check against the tip: another writer may have added the same line.
          sed -e 's/#.*//' scan-targets.txt | awk 'NF == 2 {print tolower($1) " " $2}' >"$RUNNER_TEMP/listed.txt"
          n=0
          while read -r repo path; do
            grep -qxF "$(tr '[:upper:]' '[:lower:]' <<<"$repo") $path" "$RUNNER_TEMP/listed.txt" && continue
            echo "$repo $path" >>scan-targets.txt; n=$((n + 1))
          done <"$RUNNER_TEMP/out/new-targets.txt"
          files=(scan-targets.txt)
          if [ -s "$RUNNER_TEMP/out/new-sources.txt" ]; then
            while read -r repo; do
              grep -qixF "$repo" sources.txt || echo "$repo" >>sources.txt
            done <"$RUNNER_TEMP/out/new-sources.txt"
            files+=(sources.txt)
          fi
          [ "$n" -gt 0 ] || { echo "Nothing new."; exit 0; }
          bash scripts/commit.sh "targets: +$n submitted at skills.workrr.ai" "${files[@]}"
