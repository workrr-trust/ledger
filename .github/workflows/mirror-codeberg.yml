# Fast-forward push mirror to Codeberg (https://codeberg.org/workrr-trust/ledger).
#
# Uses the CODEBERG_TOKEN repository secret (a Codeberg repo/org access token
# with repository write scope on workrr-trust/ledger). If CODEBERG_TOKEN is not
# configured yet, the job logs a notice and exits 0 cleanly.
name: mirror-codeberg

on:
  push:
    branches:
      - main
  # Most ledger commits are made by the ledger's own workflows with GITHUB_TOKEN,
  # and GitHub never starts a `push` run for those. So also mirror after each of
  # them finishes; the job is a no-op when Codeberg is already at GitHub's tip.
  workflow_run:
    workflows: [monitor, discover, ingest, anchor]
    types: [completed]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeberg-mirror
  cancel-in-progress: false

env:
  CODEBERG_ORG: workrr-trust
  CODEBERG_REPO_NAME: ledger
  CODEBERG_REPO: https://codeberg.org/workrr-trust/ledger.git

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check CODEBERG_TOKEN secret
        id: secret
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "${CODEBERG_TOKEN:-}" ]; then
            echo "::notice::CODEBERG_TOKEN secret is not configured; skipping Codeberg mirror push."
            echo "configured=false" >>"$GITHUB_OUTPUT"
          else
            echo "configured=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secret.outputs.configured == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure Codeberg repository exists and push fast-forward
        if: steps.secret.outputs.configured == 'true'
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            "https://codeberg.org/api/v1/repos/${CODEBERG_ORG}/${CODEBERG_REPO_NAME}")
          if [ "$status" = "404" ]; then
            echo "Attempting to create ${CODEBERG_ORG}/${CODEBERG_REPO_NAME} on Codeberg..."
            create_status=$(curl -s -o /tmp/cb-create.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: token ${CODEBERG_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name":"ledger","description":"Public workrr trust certificate and Rekor checkpoint ledger mirror","private":false,"auto_init":false,"default_branch":"main"}' \
              "https://codeberg.org/api/v1/orgs/${CODEBERG_ORG}/repos" || true)
            if [ "$create_status" != "201" ] && [ "$create_status" != "409" ]; then
              echo "::warning::https://codeberg.org/${CODEBERG_ORG}/${CODEBERG_REPO_NAME} does not exist yet and token lacks write:organization (HTTP $create_status); create empty repo 'ledger' under workrr-trust on Codeberg."
            fi
          fi

          basic_auth=$(printf 'x-access-token:%s' "$CODEBERG_TOKEN" | base64 | tr -d '\n')
          git_cb_once() {
            git -c credential.helper= \
              -c "http.https://codeberg.org/.extraheader=Authorization: Basic ${basic_auth}" \
              "$@"
          }
          # Codeberg returns brief 502/503/504s; retry, then leave it to the next run.
          # The canary alarms if the copy is more than 12 hours behind.
          git_cb() {
            for wait in 15 45 90 0; do
              git_cb_once "$@" && return 0
              [ "$wait" = 0 ] && break
              echo "Codeberg request failed; retrying in ${wait}s." >&2
              sleep "$wait"
            done
            return 1
          }
          unreachable() {
            echo "::warning::Codeberg unreachable after retries; the next run will catch up."
            exit 0
          }

          git fetch --quiet origin main
          local_tip=$(git rev-parse origin/main)
          remote_tip=$(git_cb ls-remote "$CODEBERG_REPO" refs/heads/main) || unreachable
          remote_tip=$(cut -f1 <<<"$remote_tip")
          if [ "$remote_tip" = "$local_tip" ]; then
            echo "Codeberg mirror is already at $local_tip."
            exit 0
          fi
          if [ -n "$remote_tip" ]; then
            git_cb fetch --quiet "$CODEBERG_REPO" main || unreachable
            if ! git merge-base --is-ancestor "$remote_tip" "$local_tip"; then
              echo "::error::Codeberg main ($remote_tip) is not an ancestor of GitHub main ($local_tip); refusing non-fast-forward push."
              exit 1
            fi
          fi
          git_cb push "$CODEBERG_REPO" "$local_tip:refs/heads/main" || unreachable
          echo "Mirrored $local_tip to $CODEBERG_REPO"
      - name: Ask Software Heritage to archive Codeberg mirror
        if: steps.secret.outputs.configured == 'true'
        continue-on-error: true
        run: |
          curl -fsS -X POST "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://codeberg.org/workrr-trust/ledger/" |
            jq '{save_request_status, save_task_status, origin_url}'
