name: Submit a certificate
description: Index a Workrr certificate in the public ledger. No access needed; the ledger verifies it automatically.
title: "Submit certificate"
labels: [certificate]
body:
  - type: markdown
    attributes:
      value: |
        Name the repository that ran the Workrr certifier and the artifact digest it printed
        (`subject-digest`). The ledger fetches the certificate from GitHub's public attestation
        store, re-verifies it against your source, and replies here.
  - type: input
    id: repository
    attributes:
      label: Repository
      placeholder: owner/repo
    validations:
      required: true
  - type: input
    id: digest
    attributes:
      label: Artifact digest
      placeholder: sha256:91cf3310705a521728b52c44f5e62df49767895e73eb0990d5ea739c7df8c884
    validations:
      required: true
